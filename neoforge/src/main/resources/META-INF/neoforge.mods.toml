modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issues}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
# updateJSONURL = "https://mrcrayfish.com/modupdatejson?id=${mod_id}"
displayURL = "${mod_homepage}"
logoFile = "${mod_id}_banner.png"
logoBlur = false
authors = "${mod_author}"
description = "${mod_desc}"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "framework"
type = "required"
versionRange = "[${framework_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "refurbished_furniture"
type = "optional"
versionRange = "[${refurbished_furniture_version},)"
ordering = "NONE"
side = "BOTH"

[modproperties."${mod_id}"]
    catalogueImageIcon="${mod_id}_icon.png"
    catalogueBackground="${mod_id}_background.png"
    configuredBackground="minecraft:textures/block/stripped_oak_log.png"
